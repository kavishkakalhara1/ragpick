metadata:
  name: conversational
  description: >-
    Multi-turn assistants: each follow-up ("and can I cancel it?") is rewritten into
    a standalone question using the session's history (LLM, or offline context
    carry-over), then answered with hybrid retrieval. Sessions are stored per owner.
  best_for:
    - chat assistants and support bots where users ask follow-up questions
  tradeoffs:
    - one extra LLM call per turn to rewrite the question
    - sessions need storage (memory, or SQLite to survive restarts)
  status: stable
defaults:
  components:
    loader: {type: directory, params: {glob: "**/*"}}
    chunker: {type: recursive, params: {chunk_size: 800, overlap: 100}}
    embedder: {type: fake, params: {dimension: 256}}
    store: {type: memory}
    keyword_index: {type: bm25, params: {k1: 1.5, b: 0.75}}
    retriever: {type: hybrid, params: {k: 20, rrf_k: 60}}
    reranker: {type: none}
    generator: {type: fake}
  conversation:
    rewrite: auto
    max_turns: 10
    store: sqlite
  query:
    top_k: 5
