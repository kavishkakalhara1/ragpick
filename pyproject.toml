[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ragpick"
dynamic = ["version"]
description = "Choose, build, evaluate, and run the right RAG architecture — architecture as code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Kavishka Kalhara" }]
maintainers = [{ name = "Kavishka Kalhara" }]
keywords = ["rag", "retrieval", "llm", "evaluation", "bm25", "hybrid-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
local = ["sentence-transformers>=3.0"]
rerank = ["sentence-transformers>=3.0"]
qdrant = ["qdrant-client>=1.9"]
pdf = ["pypdf>=4.0"]
all = ["ragpick[openai,local,rerank,qdrant,pdf]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "mkdocs-material>=9.5",
]

[project.scripts]
ragpick = "ragpick.cli:main"

[project.urls]
Homepage = "https://github.com/kavishkakalhara1/ragpick"
Documentation = "https://kavishkakalhara1.github.io/ragpick"
Issues = "https://github.com/kavishkakalhara1/ragpick/issues"
Author = "https://kavishka-kalhara.me"

[tool.hatch.version]
path = "src/ragpick/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ragpick"]

[tool.hatch.build.targets.sdist]
include = ["src/ragpick", "tests", "examples", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "mkdocs.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["ragpick"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"examples/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/ragpick"]

[[tool.mypy.overrides]]
module = ["yaml", "openai", "openai.*", "qdrant_client", "qdrant_client.*", "sentence_transformers", "sentence_transformers.*", "pypdf", "pypdf.*"]
ignore_missing_imports = true
