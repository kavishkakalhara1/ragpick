# Real models: pip install "ragpick[openai]" and export OPENAI_API_KEY.
version: 1
name: hybrid-openai
blueprint: hybrid
data: data
index_dir: .ragpick/hybrid-openai
components:
  embedder: {type: openai, params: {model: text-embedding-3-small}}
  generator: {type: openai, params: {model: gpt-4o-mini, temperature: 0}}
eval:
  judge: {type: openai, params: {model: gpt-4o-mini}}
query:
  top_k: 3
